<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Sharing - AES Encryption</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            background: #f8f9ff;
            margin: 25px 0;
            transition: all 0.3s ease;
            cursor: pointer;
            display: block;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #555;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .file-info {
            color: #888;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin: 15px 0;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            font-size: 14px;
            display: none;
            word-break: break-all;
            animation: fadeIn 0.3s ease;
            position: relative;
            border-left: 4px solid #2e7d32;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .file-name strong {
            display: block;
            margin-bottom: 8px;
            color: #1b5e20;
        }

        .file-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-text {
            flex: 1;
        }

        .cancel-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .cancel-btn:hover {
            background: #d32f2f;
            transform: rotate(90deg) scale(1.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button[type="submit"]:active:not(:disabled) {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .features {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .feature {
            display: flex;
            align-items: center;
            margin: 12px 0;
            color: #666;
            font-size: 14px;
        }

        .feature-icon {
            margin-right: 10px;
            font-size: 18px;
        }

        .view-files-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .view-files-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .browse-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .browse-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lock-icon">🔒</div>
            <h1>Secure File Sharing</h1>
            <p class="subtitle">AES-256 End-to-End Encryption</p>
        </div>

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <label for="fileInput" class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Click to select or drag & drop file</div>
                <div class="file-info">Maximum file size: 100MB</div>
                <div class="browse-button">Browse Files</div>
            </label>

            <input type="file" name="file" id="fileInput" >

            <div class="file-name" id="fileName">
                <strong>📄 Selected File:</strong>
                <div class="file-details">
                    <div class="file-text" id="fileText"></div>
                    <button type="button" class="cancel-btn" id="cancelBtn" title="Remove file">✕</button>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                🔐 Encrypt & Upload File
            </button>
        </form>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">✅</span>
                <span>Military-grade AES-256 encryption</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✅</span>
                <span>Secure file storage and transfer</span>
            </div>
            <div class="feature">
                <span class="feature-icon">✅</span>
                <span>Auto-decrypt on download</span>
            </div>
        </div>

        
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const fileText = document.getElementById('fileText');
        const cancelBtn = document.getElementById('cancelBtn');
        const submitBtn = document.getElementById('submitBtn');

        // File selected handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                displaySelectedFile(file);
            }
        });

        // Display selected file info
        function displaySelectedFile(file) {
            fileText.innerHTML = `
                ${file.name}<br>
                <small>Size: ${formatFileSize(file.size)}</small>
            `;
            fileName.style.display = 'block';
        }

        // Cancel button - clear selected file
        cancelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearFileSelection();
        });

        // Clear file selection
        function clearFileSelection() {
            fileInput.value = '';
            fileName.style.display = 'none';
            fileText.innerHTML = '';
        }

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                displaySelectedFile(files[0]);
            }
        });

        // Prevent default drag behavior
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Form submission handler
        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            if (!fileInput.files || fileInput.files.length === 0) {
                e.preventDefault();
                alert('Please select a file first!');
                return false;
            }

            submitBtn.innerHTML = '⏳ Encrypting...';
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
